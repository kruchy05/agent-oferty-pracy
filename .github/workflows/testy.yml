# Testy uruchamiane automatycznie przy każdym pushu i pull requeście.
# Bez prawdziwego klucza API i bez internetu (Claude jest udawany), z prawdziwym Postgresem w kontenerze.
name: Testy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]   # najstarszy wspierany i nowy

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testy
          POSTGRES_DB: agent_testy
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:testy@localhost:5432/agent_testy

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
